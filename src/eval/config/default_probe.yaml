output_root: output
name_prefix: eval_probe
model_kwargs:
  ckpt_path: null
dataset_kwargs:
  repo_id: medarc/adni_eval
  token: null
  cache_dir: null
classifier_kwargs:
  embed_dim: null
  dropout: 0.0
  xavier_init: true
  norm: true
# sMRI preprocessing input size (must match the checkpoint's img_size).
img_size: [208, 240, 208]
map_workers: 4
num_workers: 4
prefetch_factor: null
batch_size: 4
epochs: 20
lr: 0.0003
weight_decay: 0.05
# classifier-head hyperparameter sweep (lr/wd multipliers on the base lr/wd)
lr_scale_grid: [0.1, 1.0, 10.0]
wd_scale_grid: [1.0]
warmup_epochs: 1
accum_iter: 1
steps_per_epoch: null
clip_grad: 1.0
no_decay: false
# metrics: use [acc, f1, bacc] for classification, [r2, mae, rmse] for regression
metrics: [acc, f1, bacc]
cv_metric: bacc
balanced_sampling: false
early_stopping: true
# logging
wandb: false
wandb_entity: null
wandb_project: smri-eval
amp: true
device: cuda
seed: 4466
