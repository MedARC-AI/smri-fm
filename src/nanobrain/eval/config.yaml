# Run-level settings. Task/model choice comes from the CLI; per-model construction
# kwargs go in model_kwargs.
output_root: output/eval
name: null  # defaults to {model}__{task}

model_kwargs: {}

# Cross-validation: n_splits folds, repeated n_repeats times with shifted seeds.
# Metrics are pooled over out-of-fold predictions per repeat, then averaged over repeats.
n_splits: 5
n_repeats: 5

# Subject-level percentile bootstrap for a CI on each metric (honest sampling spread).
n_boot: 2000

device: cuda

seed: 4466
