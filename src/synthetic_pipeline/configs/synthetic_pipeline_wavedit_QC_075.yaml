generator_backend: wavedit
generator_repo: /admin/home/luka.secerovic/code/WaveDiT
generator_python: "/admin/home/luka.secerovic/code/WaveDiT/.venv/bin/python"
output_dir: /data/luka.secerovic/synthetic_mri_pipeline_wavedit_QC_075

# WaveDiT treats num_images as the total image count across all ages.
num_images: 20
random_seed: 1234
num_gpus: 1
output_size: null

targets:
  conditions: [whole_brain]
  modalities: [mri_t1]
  planes: [axial]

wavedit:
  ages: [6, 18, 30, 45, 60, 75, 90]
  checkpoint_path: null
  checkpoint_repo: danesed/WaveDiT
  checkpoint_filename: WaveDiT-Base.pth
  checkpoint_revision: main
  num_flow_steps: 10
  sampler: heun
  cfg_scale: 1.0
  cfg_rescale: 0.7
  morpheus_scale: null
  device: cuda

qc:
  mode: direct_synthseg
  threshold: 0.75
  metric: min
  synthseg_cmd: "uvx --python 3.11 --from 'git+https://github.com/MedARC-AI/SynthSeg.git' SynthSeg"
  threads: 8
  cpu: false

push_to_hf:
  # enabled: upload QC-accepted outputs to Hugging Face after the pipeline finishes.
  enabled: false
  # repo_id: target dataset repo, for example "username/synthetic-mri". Required when enabled.
  repo_id: null
  # private: visibility used when creating a new dataset repo. Existing repos keep current visibility.
  private: true
  # remote_dir: remote prefix for accepted generated images.
  remote_dir: data
  # allow_overwrite: if false, publishing fails when a remote file path already exists.
  allow_overwrite: false
