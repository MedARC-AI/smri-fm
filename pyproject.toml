[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobrain"
dynamic = ["version"]
description = "MedARC nanobrain"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "braceexpand",
    "datasets",
    "einops",
    "huggingface-hub",
    "ipython",
    "jaxtyping",
    "jupyter",
    "matplotlib",
    "nibabel",
    "numpy",
    "omegaconf",
    "pandas",
    "pre-commit",
    "pytest",
    "pyyaml",
    "s3fs",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tabulate",
    "templateflow",
    "timm",
    "torch==2.8.0",
    "torchvision",
    "tqdm",
    "wandb",
    "webdataset",
]

[project.optional-dependencies]
# cupy gives MONAI a GPU bspline resample; on CPU it is ~37x slower and dominates extraction.
neurojepa = ["neurojepa", "cupy-cuda12x"]
neurovfm = ["neurovfm"]

[tool.uv.sources]
neurojepa = { git = "https://github.com/clane9/Neuro-JEPA", rev = "e9dff69446f643b6cab8213c15a44523301e51da" }
neurovfm = { git = "https://github.com/clane9/neurovfm", rev = "ed3af2dfa1d54433f33432ebd677db6ba10a9e96" }

[tool.setuptools_scm]
version_file = "src/nanobrain/_version.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F722"]

[tool.pytest.ini_options]
norecursedirs = ["third_party", ".scratch"]
